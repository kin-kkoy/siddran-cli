[package]
name = "siddran"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Terminal client for Siddran — a peer of the desktop app, not a client of it."

[[bin]]
name = "siddran"
path = "src/main.rs"

[dependencies]
siddran-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
# Trimmed deliberately: the default feature set pulls anstream/anstyle/
# colorchoice for colour and strsim for "did you mean", none of which earn
# their compile time here.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# NOT event-stream: that pulls futures for an async Stream we must not use.
crossterm = "0.28"
# The bare matcher (Helix uses it), not the full nucleo crate — that spawns a
# thread pool, which is incompatible with the ~0%-idle requirement.
nucleo-matcher = "0.3"
signal-hook = { version = "0.3", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
